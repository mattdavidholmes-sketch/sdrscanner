<!-- Monitor card: injected into the dashboard page by dashboard2.py (one-line hook on "/"). Self-contained - polls /meter itself.
     Shows the window the channelizer is decoding right now: a tile per channel with a live level bar, green = squelch open
     (pulsing = the one you hear), amber edge = carrier present; heard log (tap to listen); nearest aircraft when airband is in the window. -->
<style>
.mon{margin-bottom:12px;border-color:var(--acc2,#2f81f7)}.mon .monhead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:8px}.mon .monhead h3{margin:0}
.mon .monchans{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.mon .mc{border:1px solid var(--line,#2a3140);border-radius:9px;padding:6px 8px;position:relative;overflow:hidden;font-size:.84rem;line-height:1.25;cursor:pointer;background:var(--card,#161b24)}
.mon .mc b{font-family:var(--mono,monospace)}.mon .mc span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.75}.mon .mc u{display:block;text-decoration:none;font-size:.78rem;color:#ffd21f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1em}
.mon .mc i{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--acc2,#2f81f7);transition:width .15s}
.mon .mc.car{border-color:#e0a030}.mon .mc.open{border-color:var(--acc,#3fb950);background:rgba(63,185,80,.14);box-shadow:0 0 0 1px var(--acc,#3fb950) inset}.mon .mc.open i{background:var(--acc,#3fb950)}
.mon .mc.act{animation:monpulse 1.2s ease-in-out infinite}@keyframes monpulse{0%,100%{box-shadow:0 0 0 1px var(--acc,#3fb950) inset}50%{box-shadow:0 0 0 3px var(--acc,#3fb950) inset}}
.mon .monheard{margin-top:8px}.mon .monheard button{margin:2px 4px 2px 0}.mon .monair{margin-top:4px}.mon .monair a{color:var(--acc,#3fb950);font-family:var(--mono,monospace)}
</style>
<script>
(function(){
 const q=s=>document.querySelector(s);
 const main=q('main');if(!main)return;
 const card=document.createElement('div');card.className='card mon';card.id='moncard';card.style.display='none';
 card.innerHTML='<div class="monhead"><h3 id="montitle">Monitor</h3><span class="sv" id="monsub"></span></div><div id="monchans" class="monchans"></div><div class="sv monheard" id="monheard"></div><div class="sv monair" id="monair"></div>';
 main.insertBefore(card,main.firstChild);
 const F=m=>Number(m).toFixed(4);const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const pct=v=>v>1?Math.max(0,Math.min(100,Math.round(100*(20*Math.log10(v/16384)+60)/60))):0;
 const dirn=b=>['N','NE','E','SE','S','SW','W','NW'][Math.round((b||0)/45)%8];
 const listen=(mhz,mode,name)=>{if(typeof P!=='undefined'&&P.play)P.play(+mhz,mode||(mhz<137?'am':'fm'),name||F(mhz));};
 let key='',hk='',air=null,airT=0,peak=0,fails=0;
 async function airPeek(){if(Date.now()-airT<8000)return;airT=Date.now();try{air=await (await fetch('/api/aircraft',{cache:'no-store'})).json();}catch(e){}}
 function render(mo,m){
  if(card.style.display==='none')card.style.display='';
  const chans=mo.chans||[],ch=mo.engine==='channelizer';
  q('#montitle').textContent=(ch?'Monitor · window '+mo.group+'/'+mo.groups:'Monitor · channel '+((mo.idx||0)+1)+'/'+mo.n)+(mo.active?' · ON AIR '+(mo.name||F(mo.active)):'');
  q('#monsub').textContent=mo.n+' channels'+(ch?' · '+chans.length+' decoded at once around '+F(mo.center||0)+' MHz · load '+Math.round((mo.load||0)*100)+'%'+(mo.audio==='sox'?' · same audio chain as a direct listen':''):' · hopping ~0.7 s per channel')+' · '+(m.open?'squelch open':'quiet');
  const k=chans.map(x=>x.mhz).join(',');const box=q('#monchans');
  if(k!==key){key=k;box.innerHTML=chans.map(x=>`<div class="mc" data-m="${x.mhz}" data-mode="${x.mode||''}" data-name="${E(x.name||'')}" title="tap to listen to just this channel"><b>${F(x.mhz)}</b><span>${E(x.name||'')}</span><u></u><i></i></div>`).join('')||'<div class="sv">starting the receiver…</div>';
   box.querySelectorAll('.mc').forEach(el=>el.onclick=()=>listen(el.dataset.m,el.dataset.mode==='am'?'am':(el.dataset.mode==='wbfm'?'wbfm':'fm'),el.dataset.name));}
  let onch={};if(window.__ft&&air&&air.aircraft){air.aircraft.forEach(a=>{if(a.lat==null||(a.on_ground&&(a.speed_kt||0)<5))return;try{let fl=[];try{fl=window.__ft?window.__ft.freqs(a).f:[];}catch(e){}if(!fl.length&&a.freqs&&a.freqs.length)fl=a.freqs;const f=fl[0];const m=f?+(Array.isArray(f)?f[0]:(f.mhz??f[0])):0;if(m)(onch[m.toFixed(4)]=onch[m.toFixed(4)]||[]).push(a.callsign||a.icao);}catch(e){}});}
 chans.forEach(x=>{const el=box.querySelector(`.mc[data-m="${x.mhz}"]`);if(!el)return;const u=el.querySelector('u');if(u){const cs=onch[(+x.mhz).toFixed(4)]||[];const t=cs.length?'✈ '+cs.slice(0,3).join(' ')+(cs.length>3?' +'+(cs.length-3):''):'';if(u.textContent!==t)u.textContent=t;}el.classList.toggle('open',!!x.open);el.classList.toggle('car',!!x.carrier&&!x.open);el.classList.toggle('act',mo.active===x.mhz);el.querySelector('i').style.width=((x.open||x.carrier)?Math.max(pct(x.level),35):pct(x.level))+'%';});
  const h=(mo.heard||[]).map(x=>x.when+x.mhz).join('|');
  if(h!==hk){hk=h;q('#monheard').innerHTML=(mo.heard&&mo.heard.length)?'Heard: '+mo.heard.slice().reverse().map(x=>`<button class="ghost" data-m="${x.mhz}" data-name="${E(x.name)}" title="listen to this channel">${E(x.name)} <span class="sv">${x.when} · ${x.secs} s${x.tones?' · '+E(x.tones):''}</span></button>`).join(''):'Nobody has talked yet - the first transmission on any of these channels plays and is logged here.';
   q('#monheard').querySelectorAll('button').forEach(b=>b.onclick=()=>listen(b.dataset.m,null,b.dataset.name));}
  const airband=chans.some(x=>x.mhz>=118&&x.mhz<137)||(mo.mhz>=118&&mo.mhz<137);
  if(airband){airPeek();const a=air;if(a&&a.aircraft){const near=a.aircraft.filter(x=>!x.on_ground).slice(0,4);
   q('#monair').innerHTML='✈ nearest now: '+(near.length?near.map(x=>`<a href="${E(x.fr24||'https://www.flightradar24.com/')}" target="_blank" rel="noopener">${E(x.callsign||x.icao)}</a> ${x.km} km ${dirn(x.bearing)}${x.alt_ft!=null?' · '+Number(x.alt_ft).toLocaleString()+' ft':''}${x.vrate?' '+(x.vrate>0?'↑':'↓'):''}${x.route?' · '+E(x.route):''}`).join(' &nbsp;·&nbsp; '):'nothing airborne nearby')+(a.source?' <span class="sv">('+E(a.source)+')</span>':'');}}
  else q('#monair').innerHTML='';
  // the player bar's level meter: the page's own meter() returns before updating it while monitoring
  const l=q('#lvl');if(l){const p=pct(m.level);const i=l.querySelector('i'),s=l.querySelector('s');if(i)i.style.width=p+'%';l.classList.toggle('open',!!m.open);peak=Math.max(p,peak*0.96);if(s)s.style.left=peak+'%';}
  const pf=q('#pfreq'),pn=q('#pname');if(mo.active){if(pf)pf.textContent=F(mo.active);if(pn)pn.textContent=(mo.name||F(mo.active))+' · ON AIR';}
 }
 async function tick(){try{const m=await (await fetch('/meter',{cache:'no-store'})).json();fails=0;if(m&&m.monitor&&m.playing)render(m.monitor,m);else if(card.style.display!=='none'){card.style.display='none';key='';hk='';}}
  catch(e){if(++fails>8&&card.style.display!=='none'){card.style.display='none';key='';}}}
 setInterval(tick,300);tick();
})();
</script>

<script>
(function(){
 const q=s=>document.querySelector(s);const tabAir=q('#tab-air');if(!tabAir)return;
 const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const LS={get:(k,d)=>{try{return localStorage.getItem(k)||d;}catch(e){return d;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}}};
 const YYZ=[43.6777,-79.6248],YTZ=[43.6275,-79.3962],D2R=Math.PI/180;
 const dirn=b=>['N','NE','E','SE','S','SW','W','NW'][Math.round((b||0)/45)%8];
 const ft=v=>v!=null?Number(v).toLocaleString()+' ft':'—';
 const arrow=x=>x.vrate>200?' ↑':(x.vrate<-200?' ↓':'');

 // ---- channels: [MHz, the name in the app's bank (what the player and the recordings call it), what the channel is]
 // Roles as published (canairradio.ca/yyz.html, Wikipedia "Toronto Area Control Centre"): 132.800 is the main arrival channel, 124.475 and
 // 125.400 the second and third; 134.175 is the ILS monitor, not a working arrival channel; 128.800 is South (main) Departure, 127.575 North

   if(!o){o=MK[x.icao]={m:L.marker(ll,{icon:icon(x),zIndexOffset:p?500:0}).addTo(layer),pts:[],ik:'',lk:'',lh:''};o.m.on('click',()=>select(x.icao,false));}
   else o.m.setLatLng(ll);
   o.x=x;const ik=[(drawnType(x)||''),Math.round((x.track||0)/5),p,x.on_ground?1:0,x.emergency?1:0].join();if(ik!==o.ik){o.ik=ik;o.m.setIcon(icon(x));o.m.setZIndexOffset(p?500:0);}
   const last=o.pts[o.pts.length-1];if(!last||last[0]!==x.lat||last[1]!==x.lon){o.pts.push(ll);if(o.pts.length>40)o.pts.shift();}
   if(o.pts.length>1){if(!o.trail)o.trail=L.polyline(o.pts,{weight:1.5,opacity:.65,interactive:false}).addTo(layer);else o.trail.setLatLngs(o.pts);o.trail.setStyle({color:col});}
   const lk=x.on_ground?'':(p||'oth'),lh=tagHtml(x,p);
   if(lk!==o.lk){o.lk=lk;o.m.unbindTooltip();if(lk)o.m.bindTooltip(lh,{permanent:true,direction:'right',offset:[p?17:13,0],className:'plabel '+lk});}else if(lk&&lh!==o.lh)o.m.setTooltipContent(lh);
   o.lh=lh;
   const heard=!!HEARD[x.callsign];if(heard&&!o.ring)o.ring=L.circleMarker(ll,{radius:19,color:'#3ddc84',weight:2,fill:false,dashArray:'3 4',interactive:false}).addTo(layer);else if(!heard&&o.ring){layer.removeLayer(o.ring);o.ring=null;}if(o.ring)o.ring.setLatLng(ll);
   // runway in use: anybody on approach lined up with a centreline, or just off the end of a runway
   if(!x.on_ground&&/YYZ/.test(phase(x))){if(p==='arr'){const r=linedUp(x,false);if(r&&r.out<32){use[r.n]=1;RWSEEN.land[r.n]=now;}}else if(p==='dep'&&(x.alt_ft||0)<3500){const r=linedUp(x,true);if(r)RWSEEN.dep[r.n]=now;}}
   if(x.emergency&&!EMG.has(x.icao)){EMG.add(x.icao);if(typeof toast==='function')toast('🚨 EMERGENCY squawk '+(x.squawk||'')+' - '+(x.callsign||x.icao)+' '+x.km+' km');}});
  for(const k in MK)if(!seen.has(k))drop(k);

  USE=use;paintRunways(use);
  if(FIRST){FIRST=false;const pts=[HOME,YYZ,YTZ].concat(Object.values(MK).filter(o=>ph(phase(o.x))&&!o.x.on_ground).map(o=>[o.x.lat,o.x.lon]));MAP.fitBounds(L.latLngBounds(pts).pad(.12),{maxZoom:11});}   // first view: home, both airports, everyone working them
  const recent=o=>Object.keys(o).filter(n=>now-o[n]<600000).sort(),ln=recent(RWSEEN.land),dp=recent(RWSEEN.dep),rw=q('#aprw');
  rw.style.display=(ln.length||dp.length)?'':'none';rw.textContent=[ln.length?'landing '+ln.join(' · '):'',dp.length?'taking off '+dp.join(' · '):''].filter(Boolean).join('  |  ');
  if(SEL&&MK[SEL]){if(!SELRING)SELRING=L.circleMarker(MK[SEL].m.getLatLng(),{radius:24,color:'#e6ebf2',weight:1.5,fill:false,interactive:false}).addTo(MAP);else SELRING.setLatLng(MK[SEL].m.getLatLng());}}
 function markSel(){document.querySelectorAll('#airside [data-icao]').forEach(el=>el.classList.toggle('sel',el.dataset.icao===SEL));if(!SEL&&SELRING){MAP.removeLayer(SELRING);SELRING=null;}}
 // pick an aircraft: from the list (the map goes to it) or on the map (the list marks it)
 // ---- (v212) the selected aircraft's panel. Everything about it in one place, and the channels it is most likely on as buttons:
 // the first one is the pick (heard there / the only one with voices lately / the best guess), the rest follow.
 let SPOKEN={},SELK='';const selEl=q('#acsel');
 function selHTML(x){const pk=pick(x),fr=pk.fr,p=phase(x),pl=x.places||[],cur=(typeof P!=='undefined'&&P.cur)?P.cur.mhz:null;
  const big=`<svg viewBox="0 0 64 64" style="transform:rotate(${x.track||0}deg)">${planOf(drawnType(x)).split(/(?=M)/).filter(Boolean).map(d=>`<path fill="#ffd21f" stroke="#10151d" stroke-width="1.2" stroke-linejoin="round" paint-order="stroke" d="${d}"/>`).join('')}</svg>`;
  const stop=(o,i)=>`<div class="st"><i>${i===0?'from':(i===pl.length-1?'to':'via')}</i><div><b>${E(o.where||o.code)}</b><span>${o.name?E(o.name)+' ':''}${o.where?'('+E(o.code)+')':''}</span></div></div>`;
  const cell=(k,v)=>`<div><i>${k}</i><b>${v}</b></div>`,sp=SPOKEN[x.callsign];
  return `<button class="x" data-x="1" title="close">×</button>
   <div class="cs">${E(x.callsign||x.icao)}${x.emergency?`<span class="emg">SQUAWK ${E(x.squawk||'')}</span>`:''}</div>${sp&&sp!==x.callsign?`<div class="said">on the radio: "${E(sp)}"</div>`:''}
   <div class="pic">${big}<div class="ty"><b>${doubt(x)?'Type not certain':E(x.desc||x.type||'type not known')}</b><span class="mu">${doubt(x)?'on file as '+E(x.desc||x.type)+' ('+E(x.reg||'')+'), which cannot fly at '+(x.speed_kt||0)+' kt - the table is out of date for this aircraft':[x.type,x.reg,x.operator].filter(Boolean).map(E).join(' · ')}</span></div></div>
   <div class="doing">${E(fr.why&&fr.why!==p?fr.why:p)}</div>
   <h5>${pk.list.length?'Listen to it':'No channel to offer for it'}</h5><div class="ch">${pk.list.map((f,i)=>`<button data-f="${f[0]}" data-n="${E(f[1])}" class="${i===0?'pk':''}${cur!=null&&Math.abs(cur-f[0])<0.003?' on':''}"><span>${cur!=null&&Math.abs(cur-f[0])<0.003?'■':'▶'}</span><b>${f[0].toFixed(3)}</b><span>${role(f)}</span>${i===0&&pk.note?`<small>${E(pk.note)}</small>`:''}</button>`).join('')}</div>
   ${pl.length?`<h5>Route</h5><div class="rt">${pl.map(stop).join('')}</div>`:(x.route?`<h5>Route</h5><div class="rt">${E(x.route)}</div>`:(x.route_file?`<h5>Route</h5><div class="mu">The route on file for this callsign (${E(x.route_file)}) does not fit where the aircraft is, so it is not shown.</div>`:''))}
   <div class="grid">${cell('Altitude',x.on_ground?'on the ground':ft(x.alt_ft))}${cell('Climb / descent',x.vrate?(x.vrate>0?'↑ ':'↓ ')+Math.abs(x.vrate)+' ft/min':'level')}${cell('Speed',(x.speed_kt||0)+' kt')}${cell('Heading',(x.track||0)+'°')}${cell('From home',x.km+' km '+dirn(x.bearing))}${cell('Squawk',E(x.squawk||'—'))}</div>
   ${HEARD[x.callsign]?`<h5>Heard on the radio</h5><div class="mu">${E(HEARD[x.callsign])}</div>`:''}
   <div class="lk">${x.fr24?`<a href="${E(x.fr24)}" target="_blank" rel="noopener">Flightradar24 ↗</a>`:''}<a href="#" data-more="${E(x.icao)}">full details…</a></div>`;}
 function paintSel(){const o=SEL&&MK[SEL];if(!o){selEl.hidden=true;SELK='';return;}const h=selHTML(o.x);if(h!==SELK){const y=selEl.scrollTop;SELK=h;selEl.innerHTML=h;selEl.scrollTop=y;}selEl.hidden=false;}
 function desel(){SEL=null;SELK='';selEl.hidden=true;markSel();}
 selEl.addEventListener('click',ev=>{const b=ev.target.closest('button[data-f]');if(b){if(typeof P!=='undefined'&&P.cur&&Math.abs(P.cur.mhz-(+b.dataset.f))<0.003&&P.stop)P.stop();else listen(b.dataset.f,b.dataset.n);setTimeout(()=>{SELK='';paintSel();},400);return;}
  if(ev.target.closest('[data-x]')){desel();return;}const m=ev.target.closest('a[data-more]');if(m){ev.preventDefault();if(typeof openAir==='function'){if(wrap.classList.contains('full'))full(false);openAir(m.dataset.more);}}});
 function select(icao,fromList){const o=MK[icao];if(!o||!MAP)return;
  if(fromList){if(wrap.getBoundingClientRect().bottom<120||wrap.getBoundingClientRect().top>innerHeight-120)wrap.scrollIntoView({behavior:'smooth',block:'center'});MAP.setView(o.m.getLatLng(),Math.max(MAP.getZoom(),11),{animate:false});}
  SEL=icao;paintSel();if(SELRING)SELRING.setLatLng(o.m.getLatLng());else SELRING=L.circleMarker(o.m.getLatLng(),{radius:24,color:'#e6ebf2',weight:1.5,fill:false,interactive:false}).addTo(MAP);markSel();
  if(!fromList){const el=q('#airside [data-icao="'+icao+'"]');if(el&&innerWidth>=1000)el.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  // keep the aircraft clear of its own panel: left of the map on a wide screen, the bottom on a phone
  const pt=MAP.latLngToContainerPoint(o.m.getLatLng()),r=selEl.getBoundingClientRect(),b=mapEl.getBoundingClientRect();
  if(innerWidth>760){const edge=r.right-b.left+40;if(pt.x<edge)MAP.panBy([pt.x-edge-30,0],{animate:true});}else{const edge=r.top-b.top-40;if(pt.y>edge)MAP.panBy([0,pt.y-edge+30],{animate:true});}}
 // map tools
 const paintLbl=()=>{q('#aplabels').textContent='Tags: '+({airport:'airport',all:'all',off:'off'}[LBL]);};paintLbl();q('#aptheme').textContent=THEME==='dark'?'☀ Light':'☾ Dark';
 q('#aplabels').onclick=()=>{mapEl.classList.remove('lbl-'+LBL);LBL={airport:'all',all:'off',off:'airport'}[LBL];mapEl.classList.add('lbl-'+LBL);LS.set('airlbl',LBL);paintLbl();};
 q('#aptheme').onclick=()=>{THEME=THEME==='dark'?'light':'dark';LS.set('airtheme',THEME);if(MAP){setTheme();paintRunways(USE);}else wrap.dataset.theme=THEME;q('#aptheme').textContent=THEME==='dark'?'☀ Light':'☾ Dark';};
 function full(on){wrap.classList.toggle('full',on);q('#apfull').textContent=on?'✕ Close':'⤢';document.documentElement.style.overflow=on?'hidden':'';if(MAP)setTimeout(()=>MAP.invalidateSize(),60);}
 q('#apfull').onclick=()=>full(!wrap.classList.contains('full'));
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&wrap.classList.contains('full'))full(false);});
 wrap.querySelectorAll('button[data-go]').forEach(b=>b.onclick=()=>{if(!MAP)return;const g=b.dataset.go;
  if(g==='home')MAP.setView(HOME,11);else if(g==='yyz')MAP.setView(YYZ,11);else{const pts=Object.values(MK).map(o=>o.m.getLatLng());if(pts.length)MAP.fitBounds(L.latLngBounds(pts).pad(.12));}});
 addEventListener('resize',()=>{if(MAP)MAP.invalidateSize();});

 // ---- the list beside the map
 let WHOK='';
 const fbtn=(f,cls,txt)=>`<button class="ghost ${cls}" data-f="${f[0]}" data-n="${E(f[1])}" title="listen on ${f[0].toFixed(3)} AM (${E(f[1])} in the bank)">${txt}</button>`;
 // a route that contradicts what the aircraft is plainly doing (the open route tables are often a different leg of the same flight number) is left out
 const routeOk=(x,p)=>{const r=x.route||'';if(!r)return '';if(p==='arr'&&/YYZ|YTZ/.test(phase(x))&&!/YYZ|YTZ/.test(r.split('→').pop()))return '';if(p==='dep'&&!/YYZ|YTZ/.test(r.split('→')[0]))return '';return r;};
 function who(a){const air=(a.aircraft||[]).filter(x=>x.lat!=null&&!x.on_ground);
  const work=air.filter(x=>ph(phase(x))).sort((p,r)=>(ph(phase(p))==='arr'?0:1)-(ph(phase(r))==='arr'?0:1)||(p.eta_min??99)-(r.eta_min??99)||p.km-r.km).slice(0,14);
  const rest=air.filter(x=>!ph(phase(x))).slice(0,work.length>5?8:14);
  q('#apn').textContent=(a.n||0)+' tracked · '+work.length+' working YYZ/YTZ';
  q('#apsrc').textContent=(a.source?'feed: '+a.source:'')+(a.age!=null?' · '+a.age+' s ago':'')+(a.error?' · '+a.error:'');q('#apsrc').classList.toggle('err',!!a.error);
  const cards=work.map(x=>{const p=ph(phase(x)),pk=pick(x),fr=pk.fr,rt=routeOk(x,p),eta=(p==='arr'&&x.eta_min!=null)?' · lands in about '+Math.max(1,Math.round(x.eta_min))+' min':'';
   return `<div class="ac ${p}${x.emergency?' emg':''}${x.icao===SEL?' sel':''}" data-icao="${E(x.icao)}"><div class="l1"><b>${E(x.callsign||x.icao)}</b><span class="sv">${E(x.type||'')}${rt?' · '+E(rt):''}</span><span class="sv ds">${x.km} km ${dirn(x.bearing)} · ${ft(x.alt_ft)}${arrow(x)}</span></div>`+
    `<div><span class="ph">${E(phase(x))}</span> <span class="sv">· ${E(fr.why)}${eta}${x.emergency?' · <b style="color:#ff5c5c">SQUAWK '+E(x.squawk)+'</b>':''}</span></div>`+
    (pk.list.length?`<div class="fq">${fbtn(pk.list[0],'pk'+(pk.conf==='heard'?' sure':''),'▶ <b>'+pk.list[0][0].toFixed(3)+'</b> '+role(pk.list[0]))}${pk.list.length>1?'<span class="cf">or</span>'+pk.list.slice(1).map(f=>fbtn(f,'alt','<b>'+f[0].toFixed(3)+'</b>')).join(''):''}${pk.note?`<span class="cf${pk.conf==='heard'?' ok':''}">${E(pk.note)}</span>`:''}</div>`:'')+`</div>`;}).join('');
  const rows=rest.map(x=>{const fr=freqs(x);return `<div class="ov${x.icao===SEL?' sel':''}" data-icao="${E(x.icao)}"><b>${E(x.callsign||x.icao)}</b><span class="sv">${E(x.type||'')}${x.route?' · '+E(x.route):''} · ${E(phase(x))}</span><span class="sv ds">${x.km} km ${dirn(x.bearing)} · ${ft(x.alt_ft)}${arrow(x)}</span>${fr.f.length?fbtn(fr.f[0],'alt','▶ <b>'+fr.f[0][0].toFixed(3)+'</b>'):''}</div>`;}).join('');
  const k=cards+'|'+rows;if(k===WHOK)return;WHOK=k;
  q('#apwho').innerHTML=cards||'<div class="sv" style="padding:4px 2px">Nobody on approach or departure right now.</div>';
  q('#apresth').style.display=rows?'':'none';q('#aprest').style.display=rows?'':'none';q('#aprest').innerHTML=rows;}
 q('#airside').addEventListener('click',ev=>{const b=ev.target.closest('button[data-f]');if(b){listen(b.dataset.f,b.dataset.n);return;}const c=ev.target.closest('[data-icao]');if(c)select(c.dataset.icao,true);});

 let busy=false;async function refresh(){if(busy||tabAir.style.display==='none'||document.hidden)return;busy=true;
  try{const a=await (await fetch('/api/aircraft',{cache:'no-store'})).json();VOICE=a.voice||{};await heardPeek();await draw(a);who(a);trackEvents(a);}catch(e){q('#apsrc').textContent='feed: '+e.message;q('#apsrc').classList.add('err');}finally{busy=false;}}
 const btn=document.querySelector('.tabs button[data-t="air"]');if(btn)btn.addEventListener('click',()=>setTimeout(()=>{refresh();if(MAP)MAP.invalidateSize();},250));
 setInterval(refresh,8000);if(tabAir.style.display!=='none')refresh();
})();
</script>

<!-- List cap: no table on the page shows more than 20 rows at once (phone scrolling); a "show all" row expands it. The Frequencies and Aircraft tables have their own cap. -->
<script>
(function(){
 const CAP=20;const open=new WeakSet();
 function cap(tb){if(tb.id==='rows'||tb.id==='airrows'||open.has(tb))return;tb._capT=Date.now();const rows=[...tb.children].filter(r=>r.tagName==='TR'&&!r.classList.contains('caprow'));
  const old=tb.querySelector('.caprow');if(old)old.remove();
  if(rows.length<=CAP){rows.forEach(r=>{if(r.dataset.capped){r.style.display='';delete r.dataset.capped;}});return;}
  rows.forEach((r,i)=>{if(i>=CAP){r.style.display='none';r.dataset.capped='1';}else if(r.dataset.capped){r.style.display='';delete r.dataset.capped;}});
  const tr=document.createElement('tr');tr.className='caprow';const td=document.createElement('td');td.colSpan=20;td.style.textAlign='center';td.innerHTML=`<button class="ghost">Show all ${rows.length} (${rows.length-CAP} more)</button>`;
  td.querySelector('button').onclick=()=>{open.add(tb);rows.forEach(r=>{r.style.display='';delete r.dataset.capped;});tr.remove();};tr.appendChild(td);tb.appendChild(tr);}
 function sweep(){document.querySelectorAll('main tbody').forEach(cap);}
 const mo=new MutationObserver(ms=>{const seen=new Set();ms.forEach(m=>{const t=m.target.closest?m.target.closest('tbody'):null;if(t&&!(t._capT&&Date.now()-t._capT<150))seen.add(t);});seen.forEach(cap);});
 mo.observe(document.querySelector('main'),{childList:true,subtree:true});sweep();
})();
</script>

<!-- Direct-listen squelch: one switch, Auto | Open. Open = squelch 0 (hear everything, weak calls included) for a channel you
     pressed play on; remembered on this device. Monitor / Follow / Quick scan always use the smart squelch (Open would pin them on hiss). -->
<style>.sqsw{display:inline-flex;border:1px solid var(--line,#2a3140);border-radius:9px;overflow:hidden;vertical-align:middle}.sqsw button{border:0;border-radius:0;padding:5px 10px;font:inherit;font-size:.85rem;background:transparent;color:inherit;cursor:pointer}.sqsw button.on{background:var(--acc,#3fb950);color:#000;font-weight:600}</style>
<script>
(function(){
 const auto=document.querySelector('#auto'),sq=document.querySelector('#sq');if(!auto||!sq||typeof P==='undefined'||!P.play)return;
 let OPEN=false;try{OPEN=localStorage.getItem('sqopen')==='1';}catch(e){}
 const sw=document.createElement('span');sw.className='sqsw';sw.title='Auto: the squelch opens when someone talks. Open: hear the channel continuously, hiss and weak calls included (direct listen only).';
 sw.innerHTML='<button data-v="0">Squelch: Auto</button><button data-v="1">Open</button>';
 auto.closest('label').before(sw);
 const paint=()=>sw.querySelectorAll('button').forEach(b=>b.classList.toggle('on',(b.dataset.v==='1')===OPEN));
 // the page's sqArg() is read at play time: wrap play so Open applies to single channels only
 let CURMD='';const orig=P.play.bind(P);P.play=function(mhz,md,name){CURMD=md||'';return orig(mhz,md,name);};
 const origSq=window.sqArg;window.sqArg=function(){if(OPEN&&CURMD!=='monitor'&&CURMD!=='digital')return '0';return origSq?origSq():(auto.checked?'auto':sq.value);};
 sw.querySelectorAll('button').forEach(b=>b.onclick=()=>{const v=b.dataset.v==='1';if(v===OPEN)return;OPEN=v;try{localStorage.setItem('sqopen',v?'1':'0');}catch(e){}paint();
  if(P.cur&&P.cur.mode!=='monitor'&&P.cur.mode!=='digital'&&P.cur.mhz>1.5)P.play(P.cur.mhz,P.cur.mode,P.cur.name);   // apply to the stream you are on now
  if(typeof toast==='function')toast(v?'Squelch open - you hear the channel continuously':'Auto squelch - opens when someone talks');});
 paint();
})();
</script>
